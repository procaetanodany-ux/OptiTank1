<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nb-drop" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#A8A3FF"/>
      <stop offset="45%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3A31C4"/>
    </linearGradient>
    <radialGradient id="nb-glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="rgba(108,99,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"/>
    </radialGradient>
    <radialGradient id="nb-teal" cx="38%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#4EECD4"/>
      <stop offset="100%" stop-color="#009E80"/>
    </radialGradient>
    <radialGradient id="nb-hl" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="nb-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 1  0 0 0 0.65 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nb-tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="256" cy="290" rx="200" ry="165" fill="url(#nb-glow)"/>

  <!-- Drop body -->
  <path d="M 256,72 C 228,72 144,162 144,282 C 144,380 195,452 256,452 C 317,452 368,380 368,282 C 368,162 284,72 256,72 Z" fill="url(#nb-drop)" filter="url(#nb-shadow)"/>
  <!-- Drop highlight -->
  <path d="M 256,72 C 228,72 144,162 144,282 C 144,380 195,452 256,452 C 317,452 368,380 368,282 C 368,162 284,72 256,72 Z" fill="url(#nb-hl)"/>

  <!-- Teal radar rings -->
  <g filter="url(#nb-tglow)">
    <circle cx="256" cy="308" r="88" fill="none" stroke="#00D4AA" stroke-width="1.5" opacity="0.18"/>
    <circle cx="256" cy="308" r="60" fill="none" stroke="#00D4AA" stroke-width="1.8" opacity="0.30"/>
    <circle cx="256" cy="308" r="34" fill="none" stroke="#00D4AA" stroke-width="2.2" opacity="0.48"/>
  </g>

  <!-- Teal eye -->
  <circle cx="256" cy="308" r="22" fill="rgba(0,212,170,0.18)"/>
  <circle cx="256" cy="308" r="14" fill="#00D4AA"/>
  <circle cx="251" cy="303" r="5.5" fill="white" opacity="0.55"/>

  <!-- Antenna stem -->
  <line x1="256" y1="72" x2="256" y2="46" stroke="#8B84FF" stroke-width="10" stroke-linecap="round"/>

  <!-- Antenna ball -->
  <circle cx="256" cy="36" r="26" fill="rgba(0,212,170,0.22)"/>
  <circle cx="256" cy="36" r="19" fill="url(#nb-teal)"/>
  <circle cx="249" cy="29" r="7" fill="white" opacity="0.50"/>
</svg>
